<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PushPlus 钉钉机器人 · 消息发送</title>

    <!-- 引入 Google Material Symbols 图标库 -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,1" />

    <style>
        /* ===== 全局重置 & 字体 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(145deg, #f6f9fc 0%, #edf2f7 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            max-width: 640px;
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 40px 36px 44px;
            box-shadow: 0 20px 60px rgba(0, 20, 40, 0.10), 0 8px 24px rgba(0, 0, 0, 0.04), inset 0 1px 0 rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: all 0.25s ease;
        }

        @media (max-width: 480px) {
            .card {
                padding: 28px 18px 32px;
                border-radius: 24px;
            }
        }

        .header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 30px;
        }

        .header .icon {
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 30px;
            box-shadow: 0 8px 18px rgba(37, 99, 235, 0.25);
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #0b1e33;
            line-height: 1.2;
        }

        .header .sub {
            font-size: 14px;
            font-weight: 400;
            color: #4a5b6e;
            margin-top: 2px;
            display: block;
        }

        .badge {
            display: inline-block;
            background: #e6f0ff;
            color: #1d4ed8;
            font-size: 12px;
            font-weight: 600;
            padding: 2px 14px;
            border-radius: 40px;
            margin-left: 8px;
            letter-spacing: 0.3px;
            border: 1px solid rgba(37, 99, 235, 0.15);
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
            font-size: 14px;
            color: #1e2a3a;
            margin-bottom: 6px;
            letter-spacing: -0.01em;
        }

        .form-group label .required {
            color: #dc2626;
            font-weight: 700;
            margin-left: 2px;
        }

        .form-group .hint {
            font-weight: 400;
            font-size: 13px;
            color: #5e6f84;
            margin-left: 4px;
        }

        .input-wrap input,
        .input-wrap textarea {
            width: 100%;
            padding: 14px 18px;
            font-size: 15px;
            font-family: inherit;
            background: #ffffff;
            border: 1.5px solid #dce3ed;
            border-radius: 16px;
            outline: none;
            transition: all 0.2s ease;
            color: #0b1e33;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
        }

        .input-wrap input:focus,
        .input-wrap textarea:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
            background: #ffffff;
        }

        .input-wrap input::placeholder,
        .input-wrap textarea::placeholder {
            color: #9aabbf;
            font-weight: 400;
            font-size: 14px;
        }

        .input-wrap textarea {
            resize: vertical;
            min-height: 100px;
            line-height: 1.5;
        }

        .flex-row {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }

        .flex-row .form-group {
            flex: 1;
            min-width: 160px;
        }

        .btn-send {
            width: 100%;
            padding: 16px 20px;
            font-size: 17px;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, #2563eb, #6d28d9);
            border: none;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.30);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            letter-spacing: 0.3px;
            margin-top: 6px;
            position: relative;
            overflow: hidden;
        }

        .btn-send:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 32px rgba(37, 99, 235, 0.35);
            background: linear-gradient(135deg, #1d4ed8, #5b21b6);
        }

        .btn-send:active {
            transform: translateY(0);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }

        .btn-send:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.15);
        }

        .btn-send .material-symbols-outlined {
            font-size: 24px;
        }

        .result-area {
            margin-top: 28px;
            border-radius: 18px;
            background: #f8fafd;
            border: 1px solid #e4ecf5;
            padding: 18px 20px 20px;
            transition: all 0.25s ease;
            display: none;
        }

        .result-area.visible {
            display: block;
            animation: fadeSlide 0.3s ease;
        }

        @keyframes fadeSlide {
            0% { opacity: 0; transform: translateY(8px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .result-area .result-header {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 12px;
        }

        .result-area .result-header .status-badge {
            padding: 2px 14px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .status-badge.success {
            background: #dcfce7;
            color: #15803d;
        }

        .status-badge.error {
            background: #fee2e2;
            color: #b91c1c;
        }

        .status-badge.pending {
            background: #fef9c3;
            color: #854d0e;
        }

        .result-message {
            font-size: 15px;
            line-height: 1.6;
            color: #0b1e33;
            padding: 6px 0;
        }

        .result-area .time {
            font-size: 12px;
            color: #6f869f;
            margin-top: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .clear-btn {
            background: transparent;
            border: none;
            color: #6f869f;
            font-size: 13px;
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 40px;
            transition: all 0.15s;
            font-weight: 500;
        }

        .clear-btn:hover {
            background: #eef3f9;
            color: #1e2a3a;
        }

        .footer {
            margin-top: 28px;
            font-size: 13px;
            color: #6b7f96;
            text-align: center;
            border-top: 1px solid #e4ecf5;
            padding-top: 22px;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .footer a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.15s;
        }

        .footer a:hover {
            color: #1d4ed8;
            text-decoration: underline;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2.5px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="card">

    <!-- ===== 头部 ===== -->
    <div class="header">
        <div class="icon">
            <span class="material-symbols-outlined">notifications</span>
        </div>
        <div>
            <h1>
                PushPlus 钉钉机器人
                <span class="badge">webhook</span>
            </h1>
            <span class="sub">向钉钉群发送自定义消息（参数已预设）</span>
        </div>
    </div>

    <!-- ===== 表单 ===== -->
    <form id="sendForm" autocomplete="off">

        <!-- 标题 + 内容 两列 -->
        <div class="flex-row">
            <div class="form-group">
                <label>
                    标题
                    <span class="required">*</span>
                </label>
                <div class="input-wrap">
                    <input
                    type="text"
                    id="title"
                    placeholder="消息标题"
                    value="来自 PushPlus 的测试消息"
                    required
                    />
                </div>
            </div>
            <div class="form-group" style="visibility: hidden; height: 0; margin: 0; padding: 0; overflow: hidden;">
                <!-- 占位，保留结构但不显示 -->
            </div>
        </div>

        <!-- 内容 -->
        <div class="form-group">
            <label>
                内容
                <span class="required">*</span>
            </label>
            <div class="input-wrap">
                <textarea
                id="content"
                placeholder="输入要发送的消息内容 …"
                required
            >📢 这是一条来自 PushPlus 的测试通知。
时间：{{现在}}
项目：演示</textarea>
        </div>
    </div>

    <!-- 发送按钮 -->
    <button type="submit" class="btn-send" id="sendBtn">
        <span class="material-symbols-outlined">send</span>
        发送消息
    </button>
</form>

<!-- ===== 结果展示区（仅显示简单状态） ===== -->
<div class="result-area" id="resultArea">
    <div class="result-header">
        <span>📨 发送状态</span>
        <span class="status-badge" id="statusBadge">成功</span>
        <span style="flex:1;text-align:right;">
            <button class="clear-btn" id="clearResultBtn">✕ 清除</button>
        </span>
    </div>
    <div class="result-message" id="resultMessage">等待响应 …</div>
    <div class="time">
        <span class="material-symbols-outlined" style="font-size:16px;">schedule</span>
        <span id="resultTime">—</span>
    </div>
</div>

<!-- ===== 底部 ===== -->
<div class="footer">
    <span>🔗 <a href="https://www.pushplus.plus/" target="_blank">PushPlus 官网</a></span>
    <span>📘 <a href="https://www.pushplus.plus/doc/" target="_blank">API 文档</a></span>
    <span>⚡ 钉钉机器人 · webhook</span>
</div>
</div>

<script>
    (function() {
        'use strict';

        // ===== 固定参数（隐藏） =====
        const TOKEN = '64d990ae6f564e3fb120b7161b8bd2c5';
        const OPTION = 'dingding';
        const CHANNEL = 'webhook';

        // ===== DOM 引用 =====
        const form = document.getElementById('sendForm');
        const titleInput = document.getElementById('title');
        const contentInput = document.getElementById('content');
        const sendBtn = document.getElementById('sendBtn');
        const resultArea = document.getElementById('resultArea');
        const resultMessage = document.getElementById('resultMessage');
        const statusBadge = document.getElementById('statusBadge');
        const resultTime = document.getElementById('resultTime');
        const clearResultBtn = document.getElementById('clearResultBtn');

        // ===== 辅助函数 =====
        function getNow() {
            return new Date().toLocaleString('zh-CN', { hour12: false });
        }

        function replacePlaceholders(text) {
            return text.replace(/\{\{现在\}\}/g, getNow());
        }

        // 显示结果（仅简单文本）
        function showResult(status, message, isSuccess) {
            resultArea.classList.add('visible');

            if (isSuccess === true) {
                statusBadge.textContent = '✓ 成功';
                statusBadge.className = 'status-badge success';
                resultMessage.textContent = '✅ ' + (message || '消息发送成功！');
            } else if (isSuccess === false) {
                statusBadge.textContent = '✕ 失败';
                statusBadge.className = 'status-badge error';
                resultMessage.textContent = '❌ ' + (message || '消息发送失败，请检查网络或参数。');
            } else {
                statusBadge.textContent = '⏳ 处理中';
                statusBadge.className = 'status-badge pending';
                resultMessage.textContent = '⏳ ' + (message || '正在发送…');
            }

            resultTime.textContent = getNow();
        }

        function clearResult() {
            resultArea.classList.remove('visible');
            resultMessage.textContent = '等待响应 …';
            resultTime.textContent = '—';
            statusBadge.textContent = '—';
            statusBadge.className = 'status-badge';
        }

        function setLoading(loading) {
            if (loading) {
                sendBtn.disabled = true;
                sendBtn.innerHTML = `
                    <span class="spinner"></span>
                    发送中 …
                `;
            } else {
                sendBtn.disabled = false;
                sendBtn.innerHTML = `
                    <span class="material-symbols-outlined">send</span>
                    发送消息
                `;
            }
        }

        // ===== 发送请求 =====
        async function sendMessage() {
            const title = titleInput.value.trim() || '无标题';
            const contentRaw = contentInput.value.trim();

            if (!contentRaw) {
                showResult('error', '请填写消息内容', false);
                contentInput.focus();
                return;
            }

            const content = replacePlaceholders(contentRaw);

            // 构建请求体（使用固定隐藏参数）
            const payload = {
                token: TOKEN,
                title: title,
                content: content,
                channel: CHANNEL,
                option: OPTION
            };

            setLoading(true);
            showResult('pending', '正在发送请求 …', null);

            try {
                const response = await fetch('https://www.pushplus.plus/send', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(payload),
                });

                const responseText = await response.text();
                let data;
                try {
                    data = JSON.parse(responseText);
                } catch (_) {
                    data = { raw: responseText };
                }

                // 判断成功：code === 200
                const isSuccess = (data && (data.code === 200 || data.code === '200'));

                if (isSuccess) {
                    showResult('success', '消息发送成功！', true);
                } else {
                    // 失败时仅显示简单提示，不展示JSON
                    const errorMsg = data?.msg || data?.message || '服务器返回错误';
                    showResult('error', '发送失败：' + errorMsg, false);
                }

            } catch (error) {
                showResult('error', '网络请求异常：' + (error.message || '未知错误'), false);
            } finally {
                setLoading(false);
            }
        }

        // ===== 事件绑定 =====
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            sendMessage();
        });

        clearResultBtn.addEventListener('click', clearResult);

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && resultArea.classList.contains('visible')) {
                clearResult();
            }
        });

        // ===== 预填充示例（内容占位符） =====
        console.log('✅ PushPlus 钉钉机器人已就绪，token 和 option 已固定隐藏');
        console.log('💡 内容中可使用 {{现在}} 自动填入当前时间');
    })();
</script>

</body>
</html>
