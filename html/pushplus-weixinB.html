<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PushPlus · 好友消息发送</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,1" />
    <style>
        /* ===== 样式与原版一致，仅做微调 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(145deg, #f6f9fc 0%, #edf2f7 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            max-width: 720px;
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 40px 36px 44px;
            box-shadow: 0 20px 60px rgba(0, 20, 40, 0.10), 0 8px 24px rgba(0, 0, 0, 0.04), inset 0 1px 0 rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: all 0.25s ease;
        }

        @media (max-width: 480px) {
            .card {
                padding: 28px 18px 32px;
                border-radius: 24px;
            }
        }

        .header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 30px;
        }

        .header .icon {
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, #07c160, #06ad56);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 30px;
            box-shadow: 0 8px 18px rgba(7, 193, 96, 0.25);
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #0b1e33;
            line-height: 1.2;
        }

        .header .sub {
            font-size: 14px;
            font-weight: 400;
            color: #4a5b6e;
            margin-top: 2px;
            display: block;
        }

        .badge {
            display: inline-block;
            background: #e6f7ed;
            color: #07c160;
            font-size: 12px;
            font-weight: 600;
            padding: 2px 14px;
            border-radius: 40px;
            margin-left: 8px;
            letter-spacing: 0.3px;
            border: 1px solid rgba(7, 193, 96, 0.15);
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
            font-size: 14px;
            color: #1e2a3a;
            margin-bottom: 6px;
            letter-spacing: -0.01em;
        }

        .form-group label .required {
            color: #dc2626;
            font-weight: 700;
            margin-left: 2px;
        }

        .form-group .hint {
            font-weight: 400;
            font-size: 13px;
            color: #5e6f84;
            margin-left: 4px;
        }

        .input-wrap input,
        .input-wrap textarea,
        .input-wrap select {
            width: 100%;
            padding: 14px 18px;
            font-size: 15px;
            font-family: inherit;
            background: #ffffff;
            border: 1.5px solid #dce3ed;
            border-radius: 16px;
            outline: none;
            transition: all 0.2s ease;
            color: #0b1e33;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
            appearance: auto;
        }

        .input-wrap input:focus,
        .input-wrap textarea:focus,
        .input-wrap select:focus {
            border-color: #07c160;
            box-shadow: 0 0 0 4px rgba(7, 193, 96, 0.12);
            background: #ffffff;
        }

        .input-wrap input::placeholder,
        .input-wrap textarea::placeholder {
            color: #9aabbf;
            font-weight: 400;
            font-size: 14px;
        }

        .input-wrap textarea {
            resize: vertical;
            min-height: 100px;
            line-height: 1.5;
        }

        .field-note {
            display: block;
            font-size: 12.5px;
            color: #5f7a9a;
            margin-top: 5px;
            padding-left: 2px;
        }

        .field-note code {
            background: #eef3f9;
            padding: 1px 10px;
            border-radius: 20px;
            font-size: 12px;
            color: #1f3a5f;
            font-weight: 500;
            border: 1px solid #dce5ef;
        }

        .flex-row {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }

        .flex-row .form-group {
            flex: 1;
            min-width: 160px;
        }

        .btn-send {
            width: 100%;
            padding: 16px 20px;
            font-size: 17px;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, #07c160, #06ad56);
            border: none;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 8px 24px rgba(7, 193, 96, 0.30);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            letter-spacing: 0.3px;
            margin-top: 6px;
            position: relative;
            overflow: hidden;
        }

        .btn-send:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 32px rgba(7, 193, 96, 0.35);
            background: linear-gradient(135deg, #06ad56, #059a4a);
        }

        .btn-send:active {
            transform: translateY(0);
            box-shadow: 0 4px 12px rgba(7, 193, 96, 0.25);
        }

        .btn-send:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: 0 4px 12px rgba(7, 193, 96, 0.15);
        }

        .btn-send .material-symbols-outlined {
            font-size: 24px;
        }

        .result-area {
            margin-top: 28px;
            border-radius: 18px;
            background: #f8fafd;
            border: 1px solid #e4ecf5;
            padding: 18px 20px 20px;
            transition: all 0.25s ease;
            display: none;
        }

        .result-area.visible {
            display: block;
            animation: fadeSlide 0.3s ease;
        }

        @keyframes fadeSlide {
            0% { opacity: 0; transform: translateY(8px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .result-area .result-header {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 12px;
        }

        .result-area .result-header .status-badge {
            padding: 2px 14px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .status-badge.success {
            background: #dcfce7;
            color: #15803d;
        }

        .status-badge.error {
            background: #fee2e2;
            color: #b91c1c;
        }

        .status-badge.pending {
            background: #fef9c3;
            color: #854d0e;
        }

        .result-message {
            font-size: 15px;
            line-height: 1.6;
            color: #0b1e33;
            padding: 6px 0;
        }

        .result-area .time {
            font-size: 12px;
            color: #6f869f;
            margin-top: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .clear-btn {
            background: transparent;
            border: none;
            color: #6f869f;
            font-size: 13px;
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 40px;
            transition: all 0.15s;
            font-weight: 500;
        }

        .clear-btn:hover {
            background: #eef3f9;
            color: #1e2a3a;
        }

        .history-area {
            margin-top: 28px;
            border-top: 1px solid #e4ecf5;
            padding-top: 22px;
        }

        .history-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .history-header h3 {
            font-size: 16px;
            font-weight: 600;
            color: #1e2a3a;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .history-header .history-actions {
            display: flex;
            gap: 10px;
        }

        .history-actions button {
            background: transparent;
            border: 1px solid #dce3ed;
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 500;
            color: #4a5b6e;
            cursor: pointer;
            transition: all 0.15s;
        }

        .history-actions button:hover {
            background: #eef3f9;
            border-color: #b0c4db;
            color: #1e2a3a;
        }

        .history-list {
            max-height: 260px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 4px;
        }

        .history-list::-webkit-scrollbar {
            width: 4px;
        }
        .history-list::-webkit-scrollbar-track {
            background: #eef3f9;
            border-radius: 10px;
        }
        .history-list::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        .history-item {
            background: #ffffff;
            border: 1px solid #eef3f9;
            border-radius: 14px;
            padding: 14px 18px;
            transition: box-shadow 0.15s;
        }

        .history-item:hover {
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .history-item .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .history-item .item-title {
            font-weight: 600;
            font-size: 14px;
            color: #0b1e33;
            word-break: break-word;
        }

        .history-item .item-status {
            font-size: 12px;
            font-weight: 600;
            padding: 2px 12px;
            border-radius: 40px;
            flex-shrink: 0;
        }

        .item-status.success {
            background: #dcfce7;
            color: #15803d;
        }

        .item-status.fail {
            background: #fee2e2;
            color: #b91c1c;
        }

        .history-item .item-content {
            font-size: 13px;
            color: #3a4b5e;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 60px;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            margin-bottom: 4px;
        }

        .history-item .item-time {
            font-size: 12px;
            color: #8a9bb0;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .empty-history {
            text-align: center;
            color: #8a9bb0;
            font-size: 14px;
            padding: 20px 0;
        }

        .footer {
            margin-top: 28px;
            font-size: 13px;
            color: #6b7f96;
            text-align: center;
            border-top: 1px solid #e4ecf5;
            padding-top: 22px;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .footer a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.15s;
        }

        .footer a:hover {
            color: #1d4ed8;
            text-decoration: underline;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2.5px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="card">

    <div class="header">
        <div class="icon">
            <span class="material-symbols-outlined">chat</span>
        </div>
        <div>
            <h1>
                PushPlus 微信服务号
                <span class="badge">微信</span>
            </h1>
            <span class="sub">向微信服务号发送消息</span>
        </div>
    </div>

    <form id="sendForm" autocomplete="off">

        <div class="flex-row">
            <div class="form-group">
                <label>
                    标题
                    <span class="required">*</span>
                </label>
                <div class="input-wrap">
                    <input
                    type="text"
                    id="title"
                    placeholder="消息标题"
                    value="来自 PushPlus 的消息"
                    required
                    />
                </div>
            </div>
            <div class="form-group" style="flex: 0.1;">
                <label>
                    接收人
                    <!-- <span class="hint">（不选则发给自己）</span> -->
                </label>
                <div class="input-wrap">
                    <select id="receiverSelect">
                        <option value="">/</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label>
                内容
                <span class="required">*</span>
            </label>
            <div class="input-wrap">
                <textarea
                id="content"
                placeholder="输入要发送的消息内容 …"
                required
            >📢 这是一条来自 PushPlus 的测试消息。</textarea>
        </div>
        <!-- <span class="field-note">⏱️ 发送时将自动在末尾添加 <code>发送时间：</code> + 当前时间</span> -->
    </div>

    <button type="submit" class="btn-send" id="sendBtn">
        <span class="material-symbols-outlined">send</span>
        发送消息
    </button>
</form>

<!-- ===== 结果展示 ===== -->
<div class="result-area" id="resultArea">
    <div class="result-header">
        <span>📨 发送状态</span>
        <span class="status-badge" id="statusBadge">成功</span>
        <span style="flex:1;text-align:right;">
            <button class="clear-btn" id="clearResultBtn">✕ 清除</button>
        </span>
    </div>
    <div class="result-message" id="resultMessage">等待响应 …</div>
    <div class="time">
        <span class="material-symbols-outlined" style="font-size:16px;">schedule</span>
        <span id="resultTime">—</span>
    </div>
</div>

<!-- ===== 历史记录 ===== -->
<div class="history-area" id="historyArea">
    <div class="history-header">
        <h3>
            <span class="material-symbols-outlined" style="font-size:20px;">history</span>
            发送记录
            <span style="font-size:12px;font-weight:400;color:#6f869f;" id="historyCount">(0)</span>
        </h3>
        <div class="history-actions">
            <button id="clearHistoryBtn">清空全部</button>
        </div>
    </div>
    <div class="history-list" id="historyList">
        <div class="empty-history">暂无发送记录</div>
    </div>
</div>

<div class="footer">
    <!-- <span>🔗 <a href="https://www.pushplus.plus/" target="_blank">PushPlus 官网</a></span> -->
    <!-- <span>📘 <a href="https://www.pushplus.plus/doc/" target="_blank">API 文档</a></span> -->
    <span>⚡ 微信服务号 · wechat</span>
</div>
</div>

<script>
    (function() {
        'use strict';

        // ===== 配置区 =====
        // 1. 您的 PushPlus Token
        const TOKEN = '64d990ae6f564e3fb120b7161b8bd2c5';

        // 2. 好友列表（名称 + 好友令牌）
        //    前端只显示名称，令牌在后台配置，发送时自动映射
        const FRIEND_LIST = [
            { name: '沐尘', token: 'c89a9d9673a54719a4ce1536c94940b5' }
            // { name: '李四', token: '好友令牌2_32位字符串' },
            // { name: '王五', token: '好友令牌3_32位字符串' }
        ];

        // 可选：指定通道（默认留空，由系统自动选择）
        const CHANNEL = 'wechat';   // 如果想使用默认通道，可设置为空字符串 ''

        // 本地存储键名
        const STORAGE_KEY = 'pushplus_friend_history';

        // ===== DOM 引用 =====
        const form = document.getElementById('sendForm');
        const titleInput = document.getElementById('title');
        const contentInput = document.getElementById('content');
        const receiverSelect = document.getElementById('receiverSelect');
        const sendBtn = document.getElementById('sendBtn');
        const resultArea = document.getElementById('resultArea');
        const resultMessage = document.getElementById('resultMessage');
        const statusBadge = document.getElementById('statusBadge');
        const resultTime = document.getElementById('resultTime');
        const clearResultBtn = document.getElementById('clearResultBtn');
        const historyList = document.getElementById('historyList');
        const historyCount = document.getElementById('historyCount');
        const clearHistoryBtn = document.getElementById('clearHistoryBtn');

        // ===== 初始化好友下拉列表 =====
        function initReceiverOptions() {
            receiverSelect.innerHTML = '<option value="">/</option>';
            FRIEND_LIST.forEach(friend => {
                const option = document.createElement('option');
                option.value = friend.token;   // value存储令牌，但界面不显示
                option.textContent = friend.name; // 只显示名称
                receiverSelect.appendChild(option);
            });
        }
        initReceiverOptions();

        // ===== 辅助函数 =====
        function getNow() {
            return new Date().toLocaleString('zh-CN', { hour12: false });
        }

        // ===== 历史记录管理 =====
        function loadHistory() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                return data ? JSON.parse(data) : [];
            } catch {
                return [];
            }
        }

        function saveHistory(records) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
            } catch (_) {}
        }

        function addHistoryRecord(record) {
            const records = loadHistory();
            records.unshift(record);
            if (records.length > 50) {
                records.pop();
            }
            saveHistory(records);
            renderHistory(records);
        }

        function clearAllHistory() {
            if (confirm('确定要清空所有发送记录吗？')) {
                saveHistory([]);
                renderHistory([]);
            }
        }

        function renderHistory(records) {
            historyList.innerHTML = '';
            if (!records || records.length === 0) {
                historyList.innerHTML = '<div class="empty-history">暂无发送记录</div>';
                historyCount.textContent = '(0)';
                return;
            }

            historyCount.textContent = `(${records.length})`;

            records.forEach((item) => {
                const div = document.createElement('div');
                div.className = 'history-item';

                const statusClass = item.status === 'success' ? 'success' : 'fail';
                const statusText = item.status === 'success' ? '✅ 成功' : '❌ 失败';

                div.innerHTML = `
                    <div class="item-header">
                        <span class="item-title">${escapeHtml(item.title || '无标题')}</span>
                        <span class="item-status ${statusClass}">${statusText}</span>
                    </div>
                    <div class="item-content">${escapeHtml(item.content || '')}</div>
                    <div class="item-time">
                        <span class="material-symbols-outlined" style="font-size:14px;">schedule</span>
                        ${escapeHtml(item.time || '')}
                    </div>
                `;
                historyList.appendChild(div);
            });
        }

        function escapeHtml(text) {
            if (!text) return '';
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        // ===== 显示结果 =====
        function showResult(status, message, isSuccess) {
            resultArea.classList.add('visible');
            if (isSuccess === true) {
                statusBadge.textContent = '✓ 成功';
                statusBadge.className = 'status-badge success';
                resultMessage.textContent = '✅ ' + (message || '消息发送成功！');
            } else if (isSuccess === false) {
                statusBadge.textContent = '✕ 失败';
                statusBadge.className = 'status-badge error';
                resultMessage.textContent = '❌ ' + (message || '消息发送失败，请检查网络或参数。');
            } else {
                statusBadge.textContent = '⏳ 处理中';
                statusBadge.className = 'status-badge pending';
                resultMessage.textContent = '⏳ ' + (message || '正在发送…');
            }
            resultTime.textContent = getNow();
        }

        function clearResult() {
            resultArea.classList.remove('visible');
            resultMessage.textContent = '等待响应 …';
            resultTime.textContent = '—';
            statusBadge.textContent = '—';
            statusBadge.className = 'status-badge';
        }

        function setLoading(loading) {
            if (loading) {
                sendBtn.disabled = true;
                sendBtn.innerHTML = `<span class="spinner"></span> 发送中 …`;
            } else {
                sendBtn.disabled = false;
                sendBtn.innerHTML = `<span class="material-symbols-outlined">send</span> 发送消息`;
            }
        }

        // ===== 发送消息 =====
        async function sendMessage() {
            const title = titleInput.value.trim() || '无标题';
            const contentRaw = contentInput.value.trim();
            const selectedToken = receiverSelect.value;

            if (!contentRaw) {
                showResult('error', '请填写消息内容', false);
                contentInput.focus();
                return;
            }

            const now = getNow();
            const content = contentRaw + '\n发送时间：' + now;

            // 构建payload，仅当选择了好友时才添加to参数
            const payload = {
                token: TOKEN,
                title: title,
                content: content
            };

            // 如果指定了channel，则加入
            if (CHANNEL && CHANNEL.trim() !== '') {
                payload.channel = CHANNEL;
            }

            // 如果选择了好友，添加to字段
            if (selectedToken && selectedToken.trim() !== '') {
                payload.to = selectedToken;
            }

            setLoading(true);
            showResult('pending', '正在发送请求 …', null);

            try {
                const response = await fetch('https://www.pushplus.plus/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });

                const responseText = await response.text();
                let data;
                try {
                    data = JSON.parse(responseText);
                } catch (_) {
                    data = { raw: responseText };
                }

                const isSuccess = (data && (data.code === 200 || data.code === '200'));
                if (isSuccess) {
                    showResult('success', '消息发送成功！', true);
                    addHistoryRecord({
                        title: title,
                        content: content,
                        status: 'success',
                        time: now
                    });
                } else {
                    const errorMsg = data?.msg || data?.message || '服务器返回错误';
                    showResult('error', '发送失败：' + errorMsg, false);
                    addHistoryRecord({
                        title: title,
                        content: content,
                        status: 'fail',
                        time: now
                    });
                }
            } catch (error) {
                showResult('error', '网络请求异常：' + (error.message || '未知错误'), false);
                addHistoryRecord({
                    title: title,
                    content: content,
                    status: 'fail',
                    time: now
                });
            } finally {
                setLoading(false);
            }
        }

        // ===== 事件绑定 =====
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            sendMessage();
        });

        clearResultBtn.addEventListener('click', clearResult);
        clearHistoryBtn.addEventListener('click', clearAllHistory);

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && resultArea.classList.contains('visible')) {
                clearResult();
            }
        });

        // ===== 初始化加载历史记录 =====
        const initialRecords = loadHistory();
        renderHistory(initialRecords);

        console.log('✅ PushPlus 好友消息页面已就绪');
        console.log('💡 不选择好友则默认发送给自己');
    })();
</script>

</body>
</html>
