<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蓝奏云 · 软件分享</title>
    <style>
        /* 全局重置与字体 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            background: linear-gradient(145deg, #f8f9fe 0%, #e9ecf5 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 1100px;
            width: 100%;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(8px);
            border-radius: 2.5rem;
            padding: 2.5rem 2rem;
            box-shadow: 0 20px 60px rgba(0, 10, 30, 0.12), 0 8px 24px rgba(0, 0, 0, 0.04);
            transition: all 0.2s ease;
        }

        /* 页面标题 */
        .page-title {
            text-align: center;
            font-size: 2.4rem;
            font-weight: 600;
            color: #1e293b;
            letter-spacing: -0.5px;
            margin-bottom: 0.4rem;
        }

        .page-sub {
            text-align: center;
            color: #64748b;
            font-size: 1rem;
            margin-bottom: 2.5rem;
            border-bottom: 2px dashed #dce1ec;
            padding-bottom: 1.2rem;
        }

        /* 卡片网格 */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.8rem;
        }

        /* 单个分类卡片 */
        .category-card {
            background: #ffffff;
            border-radius: 1.8rem;
            padding: 1.8rem 1.6rem 2rem;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04), 0 1px 4px rgba(0, 0, 0, 0.02);
            transition: transform 0.2s ease, box-shadow 0.25s ease;
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .category-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 16px 40px rgba(0, 20, 40, 0.08);
        }

        .category-title {
            font-size: 1.4rem;
            font-weight: 600;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1.2rem;
            padding-bottom: 0.6rem;
            border-bottom: 3px solid #eef2f6;
        }

        .category-title .badge {
            font-size: 0.7rem;
            font-weight: 500;
            background: #eef2f6;
            color: #334155;
            padding: 0.15rem 0.7rem;
            border-radius: 20px;
            margin-left: auto;
        }

        /* 链接列表 */
        .link-list {
            display: flex;
            flex-direction: column;
            gap: 0.7rem;
        }

        .link-item {
            display: flex;
            align-items: center;
            background: #f8fafc;
            border-radius: 1rem;
            padding: 0.4rem 0.4rem 0.4rem 1rem;
            transition: background 0.2s, box-shadow 0.2s;
            border: 1px solid transparent;
        }

        .link-item:hover {
            background: #f1f5f9;
            border-color: #dce1ec;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
        }

        .link-item a {
            text-decoration: none;
            color: #1e293b;
            font-size: 0.95rem;
            font-weight: 500;
            flex: 1;
            padding: 0.5rem 0;
            transition: color 0.15s;
        }

        .link-item a:hover {
            color: #2563eb;
        }

        .link-item .arrow {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-right: 0.6rem;
            transition: transform 0.2s;
        }

        .link-item:hover .arrow {
            transform: translateX(4px);
            color: #2563eb;
        }

        /* 空状态提示 */
        .empty-hint {
            color: #94a3b8;
            font-size: 0.9rem;
            padding: 0.6rem 0 0.2rem 0.4rem;
            font-style: italic;
            background: #f8fafc;
            border-radius: 0.8rem;
            padding: 0.6rem 1rem;
            border: 1px dashed #dce1ec;
            text-align: center;
        }

        /* 针对 “其他软件” 的特殊点缀（可不加） */
        .category-card:last-child .category-title {
            color: #1e293b;
        }

        /* 响应式微调 */
        @media (max-width: 600px) {
            .container {
                padding: 1.8rem 1rem;
            }
            .page-title {
                font-size: 1.8rem;
            }
            .card-grid {
                grid-template-columns: 1fr;
            }
            .link-item {
                padding-left: 0.8rem;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1 class="page-title">📦 蓝奏云 · 软件库</h1>
    <p class="page-sub">实用工具 · 一键直达(密码17)</p>

    <div class="card-grid">

        <!-- 驱动软件 -->
        <div class="category-card">
            <div class="category-title">

                <span class="badge">待更新</span>
            </div>
            <div class="link-list">
                <!-- 原注释内容已转为标题，下方为空链接占位，现显示提示 -->
                <div class="empty-hint">暂无驱动链接，敬请期待</div>
                <!-- 保留原始空 a 标签（隐藏或保留均可，但为了干净，不显示） -->
                <!-- 原 <a href=""></a> 已去除，用提示代替 -->
            </div>
        </div>

        <!-- 办公软件 -->
        <div class="category-card">

        </div>

        <!-- 其他软件 （所有链接） -->
        <div class="category-card">

                <span class="badge">7 个</span>
            </div>
            <div class="link-list">
                <!-- 每个链接包装为 link-item，增加箭头装饰 -->
                <div class="link-item">
                    <span class="arrow">▸</span>
                    <a href="https://yhz2001.lanzoum.com/ielwL1flk25a" target="_blank">FTP服务器</a>
                </div>
                <div class="link-item">
                    <span class="arrow">▸</span>
                    <a href="https://yhz2001.lanzoum.com/i9mo51flk23i" target="_blank">鼠标多主机协同</a>
                </div>
                <div class="link-item">
                    <span class="arrow">▸</span>
                    <a href="https://yhz2001.lanzoum.com/iwcZO2xmj6fi" target="_blank">Pixpin 截屏</a>
                </div>
                <div class="link-item">
                    <span class="arrow">▸</span>
                    <a href="https://yhz2001.lanzoum.com/iOsF73u6jj1e" target="_blank">TreeSize 磁盘分析</a>
                </div>
                <div class="link-item">
                    <span class="arrow">▸</span>
                    <a href="https://yhz2001.lanzoum.com/igCxX2xmj3vg" target="_blank">DiskGenius 磁盘管理</a>
                </div>
                <div class="link-item">
                    <span class="arrow">▸</span>
                    <a href="https://yhz2001.lanzoum.com/iTQMI3u6jvbg" target="_blank">Google 浏览器</a>
                </div>
            </div>
        </div>

    </div>
</div>

</body>
</html>
