            // 解析日期键为日期对象
            function parseDateKey(dateKey) {
                const parts = dateKey.split('-');
                return new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
            }
            
            // 开始编辑备忘录
            function startEditMemo(memoElement, memoId, dateKey, index) {
                // 如果已经有备忘录在编辑中，先取消
                if (editingMemoId && editingMemoId !== memoId) {
                    const currentEditing = document.querySelector(`.memo-item[data-id="${editingMemoId}"]`);
                    if (currentEditing) {
                        cancelEditMemo(currentEditing, editingMemoId, dateKey, 
                            Array.from(memoListElement.children).indexOf(currentEditing));
                    }
                }
                
                // 设置编辑状态
                editingMemoId = memoId;
                memoElement.classList.add('editing');
                
                const memoText = memoElement.querySelector('.memo-text');
                const editContainer = memoElement.querySelector('.memo-edit-container');
                const editInput = memoElement.querySelector('.memo-edit-input');
                const completeBtn = memoElement.querySelector('.complete-btn');
                const editBtn = memoElement.querySelector('.edit-btn');
                const saveBtn = memoElement.querySelector('.save-btn');
                const cancelBtn = memoElement.querySelector('.cancel-btn');
                
                // 切换显示/隐藏元素
                memoText.classList.add('edit-mode');
                editContainer.classList.add('active');
                completeBtn.style.display = 'none';
                editBtn.style.display = 'none';
                saveBtn.style.display = 'flex';
                cancelBtn.style.display = 'flex';
                
                // 聚焦到输入框并选中所有文本
                editInput.focus();
                editInput.select();
            }
            
            // 保存编辑的备忘录
            async function saveEditMemo(memoElement, memoId, dateKey, index) {
                const editInput = memoElement.querySelector('.memo-edit-input');
                const newText = editInput.value.trim();
                
                if (!newText) {
                    alert('备忘录内容不能为空');
                    editInput.focus();
                    return;
                }
                
                try {
                    // 从数据库获取备忘录
                    const memo = await db.getMemoById(memoId);
                    if (!memo) {
                        showNotification('备忘录不存在', true);
                        return;
                    }
                    
                    // 更新备忘录
                    memo.text = newText;
                    memo.updatedAt = new Date().toISOString();
                    
                    // 保存到数据库
                    await db.updateMemo(memo);
                    
                    // 更新显示
                    const updatedElement = createMemoElement(memo, dateKey, index);
                    const oldElement = memoListElement.children[index - 1];
                    memoListElement.replaceChild(updatedElement, oldElement);
                    
                    // 更新日历显示
                    await renderCalendar();
                    updateSelectedDayInCalendar();
                    await updateStats();
                    
                    editingMemoId = null;
                    
                    showNotification('备忘录更新成功');
                } catch (error) {
                    console.error('保存编辑失败:', error);
                    showNotification('保存失败: ' + error.message, true);
                }
            }
            
            // 取消编辑
            function cancelEditMemo(memoElement, memoId, dateKey, index) {
                memoElement.classList.remove('editing');
                
                const memoText = memoElement.querySelector('.memo-text');
                const editContainer = memoElement.querySelector('.memo-edit-container');
                const completeBtn = memoElement.querySelector('.complete-btn');
                const editBtn = memoElement.querySelector('.edit-btn');
                const saveBtn = memoElement.querySelector('.save-btn');
                const cancelBtn = memoElement.querySelector('.cancel-btn');
                
                // 切换显示/隐藏元素
                memoText.classList.remove('edit-mode');
                editContainer.classList.remove('active');
                completeBtn.style.display = 'flex';
                editBtn.style.display = 'flex';
                saveBtn.style.display = 'none';
                cancelBtn.style.display = 'none';
                
                if (editingMemoId === memoId) {
                    editingMemoId = null;
                }
            }
            
            // 取消所有编辑
            function cancelEdit() {
                if (editingMemoId) {
                    const memoElement = document.querySelector(`.memo-item[data-id="${editingMemoId}"]`);
                    if (memoElement) {
                        const memoId = memoElement.getAttribute('data-id');
                        const dateKey = getDateKey(selectedDate);
                        const index = Array.from(memoListElement.children).indexOf(memoElement) + 1;
                        cancelEditMemo(memoElement, memoId, dateKey, index);
                    }
                }
            }
            
            // 添加备忘录
            async function addMemo() {
                const memoText = memoInput.value.trim();
                if (!memoText || !selectedDate) return;
                
                const dateKey = getDateKey(selectedDate);
                
                // 创建备忘录对象
                const memoObj = {
                    id: generateId(),
                    dateKey: dateKey,
                    text: memoText,
                    createdAt: new Date().toISOString(),
                    updatedAt: new Date().toISOString(),
                    completed: false
                };
                
                try {
                    // 添加到数据库
                    await db.addMemo(memoObj);
                    
                    // 更新显示
                    await displayMemosForDate(dateKey);
                    await updateStats();
                    
                    // 更新日历显示
                    await renderCalendar();
                    updateSelectedDayInCalendar();
                    
                    // 清空输入框
                    memoInput.value = '';
                    memoInput.focus();
                    
                    showNotification('备忘录添加成功');
                } catch (error) {
                    console.error('添加备忘录失败:', error);
                    showNotification('添加失败: ' + error.message, true);
                }
            }
            
            // 删除备忘录
            async function deleteMemo(dateKey, memoId) {
				try {
					// 从数据库删除
					await db.deleteMemo(memoId);
					
					// 如果正在编辑这个备忘录，先取消编辑
					if (editingMemoId === memoId) {
						editingMemoId = null;
					}
					
					// 重新显示备忘录列表
					await displayMemosForDate(dateKey);
					await updateStats();
					
					// 重新渲染日历
					await renderCalendar();
					updateSelectedDayInCalendar();
					
					showNotification('备忘录删除成功');
				} catch (error) {
					console.error('删除备忘录失败:', error);
					showNotification('删除失败: ' + error.message, true);
				}
			}
            
            // 更新统计信息
            async function updateStats() {
                const year = currentDate.getFullYear();
                const month = currentDate.getMonth();
                
                try {
                    const stats = await db.getMonthStats(year, month);
                    
                    // 更新当月统计显示
                    totalMemosElement.textContent = stats.totalMemos;
                    daysWithMemosElement.textContent = stats.daysWithMemos;
                    
                    // 计算完成百分比
                    const completionPercentage = stats.completionPercentage;
                    completionPercentageElement.textContent = `${completionPercentage}%`;
                    
                    // 根据完成百分比设置颜色
                    if (completionPercentage === 100) {
                        completionPercentageElement.style.color = 'var(--completed-color)';
                    } else if (completionPercentage >= 70) {
                        completionPercentageElement.style.color = 'var(--success-color)';
                    } else if (completionPercentage >= 30) {
                        completionPercentageElement.style.color = 'var(--memo-indicator)';
                    } else {
                        completionPercentageElement.style.color = 'var(--danger-color)';
                    }
                } catch (error) {
                    console.error('更新统计信息失败:', error);
                    // 如果出错，显示默认值
                    totalMemosElement.textContent = '0';
                    daysWithMemosElement.textContent = '0';
                    completionPercentageElement.textContent = '0%';
                }
            }
            
            // 获取日期键
            function getDateKey(date) {
                return `${date.getFullYear()}-${date.getMonth() + 1}-${date.getDate()}`;
            }
            
            // 设置事件监听器
            function setupEventListeners() {
                prevMonthButton.addEventListener('click', async function() {
                    currentDate.setMonth(currentDate.getMonth() - 1);
                    await renderCalendar();
                    await updateStats();
                });
                
                nextMonthButton.addEventListener('click', async function() {
                    currentDate.setMonth(currentDate.getMonth() + 1);
                    await renderCalendar();
                    await updateStats();
                });
                
                addMemoButton.addEventListener('click', addMemo);
                
                memoInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        addMemo();
                    }
                });
                
                // 主题选择器事件
                themeSelect.addEventListener('change', function() {
                    applyColorScheme(this.value);
                });
                
                // 导出按钮事件
                exportBtn.addEventListener('click', exportMemos);
                
                // 导入按钮事件
                importBtn.addEventListener('click', function() {
                    importFileInput.click();
                });
                
                // 文件选择事件
                importFileInput.addEventListener('change', function(e) {
                    const file = e.target.files[0];
                    if (file) {
                        importMemos(file);
                        // 清空输入框，以便再次选择同一文件
                        e.target.value = '';
                    }
                });
                
                // 一键完成按钮事件
                completeAllBtn.addEventListener('click', async function() {
                    if (confirm('确定要标记本月所有备忘录为完成吗？')) {
                        await completeAllMemos();
                    }
                });
                
                // 搜索按钮事件
                searchBtn.addEventListener('click', toggleSearchPanel);
                
                // 关闭搜索按钮事件
                closeSearchBtn.addEventListener('click', closeSearchPanel);
                
                // 执行搜索按钮事件
                searchExecuteBtn.addEventListener('click', searchMemos);
                
                // 搜索输入框回车事件
                searchInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        searchMemos();
                    }
                });
                
                // 未完成过滤按钮事件
                incompleteFilterBtn.addEventListener('click', async function() {
                    await toggleIncompleteFilter();
                });
                
                // 修改键盘导航支持部分，添加对输入框焦点的检查
				document.addEventListener('keydown', async function(e) {
					// 检查当前焦点是否在输入框中
					const activeElement = document.activeElement;
					const isInputElement = 
						activeElement.tagName === 'INPUT' || 
						activeElement.tagName === 'TEXTAREA' ||
						activeElement.classList.contains('memo-edit-input') ||
						activeElement.id === 'memo-input' ||
						activeElement.id === 'search-input';
					
					// 如果焦点在输入框中，且按下的是左右箭头键，则不切换月份
					if (isInputElement && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
						return; // 直接返回，不执行月份切换
					}
					
					if (e.key === 'ArrowLeft') {
						currentDate.setMonth(currentDate.getMonth() - 1);
						await renderCalendar();
						await updateStats();
					} else if (e.key === 'ArrowRight') {
						currentDate.setMonth(currentDate.getMonth() + 1);
						await renderCalendar();
						await updateStats();
					} else if (e.key === 'Escape' && editingMemoId) {
						cancelEdit();
					} else if (e.key === 'Escape' && searchPanel.classList.contains('active')) {
						closeSearchPanel();
					} else if (e.key === 'f' && (e.ctrlKey || e.metaKey)) {
						e.preventDefault();
						toggleSearchPanel();
					}
				});
                
                // 页面卸载前关闭数据库连接
                window.addEventListener('beforeunload', function() {
                    if (db && db.close) {
                        db.close();
                    }
                });
            }
            
            // 初始化应用
            initCalendar();
        });
    </script>
</body>
</html>
